[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "heatrisk"
version = "0.1.0"
description = "Helpers for screening heat hazard in CMIP6 daily temperature data"
authors = [{ name = "Dayan Sunny" }]
license = "MIT"
requires-python = ">=3.10"
dependencies = ["xarray", "numpy", "scipy", "cartopy", "shapely>=2.0"]

[tool.setuptools.packages.find]
where = ["src"]
